<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Embed fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sen:wght@700&display=swap"
        rel="stylesheet"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="./assets/css/sign.css">
</head>
<body>
    <div class="container">
        <div class="sub-container">
            <!-- Sign In -->
            <div class="left-container" id="signin">
                <div class="left">
                    <h1 class="a-heading">
                        Sign In
                    </h1>
                    <form class="login">
                        <label for="Email">Email address</label>
                        <input class="ip" type="email" placeholder="Email" id="Email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$">
                        <label for="password">Password</label>
                        <input class="ip" type="password" placeholder="Password" id="password" required>
                        <p class="f-password">Forgot password?</p>
                        <button type="submit" class="s-button">Sign In</button>
                        <p class="n-new">New member<i class="t-button" aria-hidden="true" onclick="showSignup()">Sign up now</i></p>
                    </form>
                    <!-- Action Link -->
                    <p class="note">Or Sign Up Using</p>
                    <div class="action">
                        <a href="#!" class="icon icon__fb">
                            <img src="./assets/img/facebook.svg" alt="">
                        </a>
                        <a href="#!" class="icon icon__tw">
                            <img src="./assets/img/twitter.svg" alt="">
                        </a>
                        <a href="#!" class="icon icon__insta">
                            <img src="./assets/img/instagram.svg" alt="">
                        </a>
                    </div>
                </div>
            </div>

            <!-- Sign Up -->
            <div class="right-container" id="signup">
                <div class="right">
                    <h1 class="a-heading">Sign Up</h1>
                    <form class="signup">
                        <label for="name">Username</label>
                        <input class="ip" type="text" placeholder="Name" id="name" required autocomplete="off">
                        <label for="email">Email address</label>
                        <input class="ip" type="email" placeholder="Email" id="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$">
                        <label for="password">Password</label>
                        <input class="ip" type="password" placeholder="Password" id="password" required>
                        <div class="confirm">
                            <input type="checkbox" required>
                            <p>I do not want to receive email with advertising news suggestion or marking promotions</p>
                        </div>
                        <button type="submit" class="s-button">Sign Up</button>
                        <p class="n-new">Already have an account ?<i class="t-button" aria-hidden="true" onclick="hideSignup()">Sign In</i></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        var signup = document.getElementById('signup');
        var signin = document.getElementById('signin');
        function showSignup() {
            signin.style.display = "none";
            signup.style.display = "block";
        }
        function hideSignup() {
            signin.style.display = "block";
            signup.style.display = "none";
        }
    </script>
</body>
</html>
